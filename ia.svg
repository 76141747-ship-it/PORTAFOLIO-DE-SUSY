<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290"><rect width="900" height="290" rx="22" fill="#edf4fb"/><g font-family="Arial" text-anchor="middle"><rect x="45" y="78" width="180" height="130" rx="18" fill="#fff" stroke="#087e8b" stroke-width="3"/><text x="135" y="122" font-size="22" font-weight="bold" fill="#12304a">Estudiante</text><text x="135" y="155" font-size="16" fill="#526b7a">Define la pregunta</text><text x="135" y="178" font-size="16" fill="#526b7a">y el propósito</text><path d="M230 143h85m-17-13 17 13-17 13" stroke="#e7a83e" stroke-width="5" fill="none"/><rect x="325" y="78" width="230" height="130" rx="18" fill="#fff" stroke="#087e8b" stroke-width="3"/><text x="440" y="122" font-size="22" font-weight="bold" fill="#12304a">IA generativa</text><text x="440" y="155" font-size="16" fill="#526b7a">Propone estructura,</text><text x="440" y="178" font-size="16" fill="#526b7a">explica y resume</text><path d="M560 143h85m-17-13 17 13-17 13" stroke="#e7a83e" stroke-width="5" fill="none"/><rect x="655" y="78" width="200" height="130" rx="18" fill="#dff3ec" stroke="#087e8b" stroke-width="3"/><text x="755" y="122" font-size="22" font-weight="bold" fill="#12304a">Verificación</text><text x="755" y="155" font-size="16" fill="#526b7a">Fuentes, exactitud,</text><text x="755" y="178" font-size="16" fill="#526b7a">ética y autoría</text></g><text x="450" y="252" text-anchor="middle" font-family="Arial" font-size="16" fill="#526b7a">La IA apoya el aprendizaje; la responsabilidad académica sigue siendo humana.</text></svg>